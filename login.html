<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>FaceID App</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { margin:0; background:#0a0a0f; }
    #login-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      overflow: hidden;
    }
    .login-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(0,229,255,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(124,58,237,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .login-box {
      position: relative;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .login-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
      animation: loginPulse 3s ease-in-out infinite;
    }
    @keyframes loginPulse {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(0,229,255,0.4)); }
      50% { filter: drop-shadow(0 0 18px rgba(0,229,255,0.7)); }
    }
    h1 {
      font-family: -apple-system, sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: #fff;
      margin: 0 0 4px 0;
      text-transform: uppercase;
    }
    h1 span { color: #00e5ff; }
    .login-sub {
      font-family: -apple-system, sans-serif;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.08em;
      margin-bottom: 36px;
    }
    .login-fields {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 10px;
    }
    .field-wrap {
      position: relative;
      width: 100%;
    }
    .field-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.4;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,229,255,0.18);
      border-radius: 12px;
      padding: 14px 14px 14px 42px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      font-family: -apple-system, sans-serif;
    }
    input::placeholder { color: rgba(255,255,255,0.3); }
    input:focus {
      border-color: rgba(0,229,255,0.55);
      background: rgba(0,229,255,0.05);
    }
    .login-error {
      font-size: 0.78rem;
      color: #ff4d6d;
      min-height: 20px;
      text-align: center;
      margin-bottom: 6px;
      opacity: 0;
      font-family: -apple-system, sans-serif;
    }
    .btn-login {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #00e5ff 0%, #7c3aed 100%);
      color: #0a0a0f;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      margin-top: 4px;
      font-family: -apple-system, sans-serif;
    }
    .login-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 22px 0 16px;
    }
    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }
    .login-divider span {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.3);
      font-family: -apple-system, sans-serif;
    }
    .btn-register {
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      border: 1px solid rgba(0,229,255,0.25);
      background: transparent;
      color: #00e5ff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: -apple-system, sans-serif;
    }
    #register-panel { display: none; width: 100%; flex-direction: column; gap: 14px; }
    #register-panel.visible { display: flex; }
    .back-link {
      margin-top: 14px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.35);
      cursor: pointer;
      text-decoration: underline;
      font-family: -apple-system, sans-serif;
    }
  </style>
</head>
<body>
<div id="login-screen">
  <div class="login-bg"></div>
  <div class="login-box">

    <div class="login-logo">
      <svg viewBox="0 0 80 80" fill="none" width="80" height="80">
        <circle cx="40" cy="40" r="36" stroke="url(#lg1)" stroke-width="2.5"/>
        <path d="M27 30 Q40 20 53 30 L53 45 Q40 60 27 45 Z" stroke="url(#lg1)" stroke-width="1.5" fill="none"/>
        <circle cx="34" cy="36" r="3" fill="#00e5ff" opacity="0.8"/>
        <circle cx="46" cy="36" r="3" fill="#00e5ff" opacity="0.8"/>
        <path d="M34 46 Q40 51 46 46" stroke="#00e5ff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <defs>
          <linearGradient id="lg1" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00e5ff"/>
            <stop offset="100%" stop-color="#7c3aed"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <h1>FACE<span>ID</span></h1>
    <p class="login-sub">Accede a tu cuenta para continuar</p>

    <div id="login-panel" style="width:100%;display:flex;flex-direction:column;align-items:center;">
      <div class="login-fields">
        <div class="field-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="login-user" placeholder="Usuario" autocomplete="username" />
        </div>
        <div class="field-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="login-pass" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" />
        </div>
      </div>
      <div class="login-error" id="login-error"></div>
      <button class="btn-login" onclick="doLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Ingresar
      </button>
      <div class="login-divider"><span>¿No tienes cuenta?</span></div>
      <button class="btn-register" onclick="showRegister()">Crear cuenta nueva</button>
    </div>

    <div id="register-panel">
      <div class="login-fields" style="margin-bottom:0;">
        <div class="field-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="reg-user" placeholder="Nuevo usuario" autocomplete="off" />
        </div>
        <div class="field-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="reg-pass" placeholder="Contraseña" autocomplete="new-password" />
        </div>
        <div class="field-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="reg-pass2" placeholder="Confirmar contraseña" autocomplete="new-password" onkeydown="if(event.key==='Enter')doRegister()" />
        </div>
      </div>
      <div class="login-error" id="register-error"></div>
      <button class="btn-login" onclick="doRegister()" style="margin-top:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        Registrarme
      </button>
      <span class="back-link" onclick="showLogin()">← Volver al inicio de sesión</span>
    </div>

  </div>
</div>

<script>
  const USERS_KEY = 'faceid_users';
  function getUsers() {
    try { return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; }
    catch(e) { return {}; }
  }
  function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }

  function doLogin() {
    var user = document.getElementById('login-user').value.trim();
    var pass = document.getElementById('login-pass').value;
    var err  = document.getElementById('login-error');
    err.style.opacity = '0';
    if (!user || !pass) {
      err.textContent = 'Completa todos los campos';
      err.style.opacity = '1'; return;
    }
    var users = getUsers();
    if (users[user] && users[user] === pass) {
      window.location.href = 'app.html';
    } else {
      err.textContent = 'Usuario o contraseña incorrectos';
      err.style.opacity = '1';
      document.getElementById('login-pass').value = '';
    }
  }

  function showRegister() {
    document.getElementById('login-panel').style.display = 'none';
    document.getElementById('register-panel').classList.add('visible');
  }
  function showLogin() {
    document.getElementById('register-panel').classList.remove('visible');
    document.getElementById('login-panel').style.display = 'flex';
  }
  function doRegister() {
    var user  = document.getElementById('reg-user').value.trim();
    var pass  = document.getElementById('reg-pass').value;
    var pass2 = document.getElementById('reg-pass2').value;
    var err   = document.getElementById('register-error');
    err.style.opacity = '0';
    if (!user || !pass || !pass2) { err.textContent='Completa todos los campos'; err.style.opacity='1'; return; }
    if (pass !== pass2) { err.textContent='Las contraseñas no coinciden'; err.style.opacity='1'; return; }
    if (pass.length < 4) { err.textContent='Mínimo 4 caracteres'; err.style.opacity='1'; return; }
    var users = getUsers();
    if (users[user]) { err.textContent='Ese usuario ya existe'; err.style.opacity='1'; return; }
    users[user] = pass;
    saveUsers(users);
    window.location.href = 'app.html';
  }
</script>
</body>
</html>
